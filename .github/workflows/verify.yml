name: verify

# The gate every ticket and every release depends on. It was local-only until
# ticket 16; a stranger who clones the repo had no signal.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines floor is 22.18; the dev machine runs 24.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Includes the M10 benchmark and the installed-layout packaging test.
      # Postgres tests skip cleanly without DATABASE_URL.
      - run: npm test

      # Ticket 17: a gate run must not rewrite a tracked file.
      - name: the gate leaves the tree clean
        run: test -z "$(git status --porcelain)"

      # Refuses a tracked local absolute path or a token-shaped string.
      - run: node scripts/pack-release.mjs
